        "200":
          description: "{ data: { candidates } }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [candidates]
                    properties:
                      candidates:
                        type: array
                        items: { $ref: "#/components/schemas/DuplicateCandidate" }
              example:
                data:
                  candidates:
