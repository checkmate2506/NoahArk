      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      roles:
                        type: array
                        items: { $ref: "#/components/schemas/Role" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRole
      summary: Create a custom role
      x-noahark-permission: role:create
      x-noahark-csrf: true
      description: The caller cannot grant a permission they do not themselves hold (no self-escalation via role creation).
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key:
                  { type: string, pattern: "^[a-z0-9_]+$", minLength: 1, maxLength: 50 }
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                permissionKeys: { type: array, items: { type: string }, default: [] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties: { role: { $ref: "#/components/schemas/Role" } },
                      },
                  }
        "403":
          description: Missing role:create, or attempted to grant a permission the caller does not hold (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: A role with this key already exists (CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

