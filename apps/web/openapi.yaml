    delete:
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      x-noahark-permission: membership:invite
      x-noahark-csrf: true
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/invitationId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  { data: { $ref: "#/components/schemas/MembershipInvitation" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
