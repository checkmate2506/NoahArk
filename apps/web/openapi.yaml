        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tenants/{tenantId}/roles/{roleId}:
    patch:
      operationId: updateRolePermissions
      summary: Replace a role's permission set
      x-noahark-permission: role:update
      x-noahark-csrf: true
      description: System roles reject this with FORBIDDEN. No self-escalation, same rule as create.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/roleId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionKeys]
              properties:
                permissionKeys: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties: { role: { $ref: "#/components/schemas/Role" } },
                      },
                  }
        "403":
          description: Missing role:update, escalation attempt, or a system role (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteRole
      summary: Delete a role
      x-noahark-permission: role:delete
      x-noahark-csrf: true
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/roleId" }
      responses:
        "200":
          description: "{ data: { id, deleted: true } }"
        "403":
          description: System roles cannot be deleted (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot delete a role that is currently assigned (CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /tenants/{tenantId}/role-assignments:
    post:
      operationId: assignRole
      summary: Assign a role (optionally scoped to a legal entity) to a membership
      x-noahark-permission: role:assign
      x-noahark-csrf: true
      description: >
        Enforced via assertCanAssignRole — self-assignment is blocked, and
        the caller cannot delegate a role whose permissions exceed their
        own. Writes both an audit event and an outbox event
        (membership_role.assigned).
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantMembershipId, roleId]
              properties:
                tenantMembershipId: { type: string, minLength: 1 }
                roleId: { type: string, minLength: 1 }
                legalEntityId: { type: [string, "null"], default: null }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties:
                          { assignment: { $ref: "#/components/schemas/MembershipRole" } },
                      },
                  }
        "403":
          description: Missing role:assign, self-assignment, or escalation attempt (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tenants/{tenantId}/role-assignments/{assignmentId}:
    delete:
      operationId: unassignRole
      summary: Remove a role assignment
      x-noahark-permission: role:assign
      x-noahark-csrf: true
      description: Self-unassignment is explicitly blocked.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/assignmentId" }
      responses:
        "200":
          description: "{ data: { id, deleted: true } }"
        "403":
          description: You cannot change your own role assignment (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/settings:
    get:
      operationId: listTenantSettings
      summary: List tenant-wide settings
      x-noahark-permission: settings:read
      x-noahark-csrf: false
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      settings:
                        type: array
                        items: { $ref: "#/components/schemas/TenantSetting" }
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateTenantSetting
      summary: Upsert a single tenant-wide setting
      x-noahark-permission: settings:update
      x-noahark-csrf: true
      description: value is additionally validated per-key by @noahark/config's validateTenantSettingValue.
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string, minLength: 1 }
                value: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties:
                          { setting: { $ref: "#/components/schemas/TenantSetting" } },
                      },
                  }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tenants/{tenantId}/audit:
    get:
      operationId: listAuditEvents
      summary: List this tenant's audit trail
      x-noahark-permission: audit:read
      x-noahark-csrf: false
      description: Cursor-paginated on the hash chain's own monotonic `sequence` (F-32, Phase 1B.1) — not createdAt, which ties under real concurrency.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/AuditEventPage" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid pagination cursor (VALIDATION_FAILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /tenants/{tenantId}/approvals:
    get:
      operationId: listApprovalRequests
      summary: List approval requests
      x-noahark-permission: approval:read
      x-noahark-csrf: false
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requests:
                        type: array
                        items: { $ref: "#/components/schemas/ApprovalRequest" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: submitDemoApproval
      summary: Submit the neutral demo approval workflow (proves the approval engine end to end — not a real business document)
      x-noahark-permission: approval:submit
      x-noahark-csrf: true
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                legalEntityId: { type: [string, "null"], default: null }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subject: {}
                      request: { $ref: "#/components/schemas/ApprovalRequest" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No active approval policy for demo.approval_subject (CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          description: MODULE_DISABLED if the tenant has disabled the "approvals" module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /tenants/{tenantId}/approvals/{requestId}/decide:
    post:
      operationId: decideApproval
      summary: Approve, reject or cancel an approval request
      x-noahark-permission: approval:decide
      x-noahark-csrf: true
      description: >
        Requires BOTH approval:decide AND the caller holding the specific
        role the current step names as its approver (a sixth, distinct
        authorization check — assertApprovalAuthority in @noahark/workflow),
        except for `action: CANCEL`, which is authorized solely by "you are
        the submitter of your own still-pending request" and does NOT
        require approval:decide. Self-approval is rejected unless the
        policy explicitly sets allowSelfApproval. Optimistic concurrency
        via expectedVersion, double-checked at the DB layer with an atomic
        UPDATE ... WHERE version = expectedVersion (F-22, Phase 1B.1
        confirms this closes a genuine two-approver race, not just
        sequential re-decision).
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/approvalRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedVersion]
              properties:
                action: { type: string, enum: [APPROVE, REJECT, CANCEL] }
                comment: { type: string, maxLength: 1000 }
                expectedVersion:
                  type: integer
                  description: Optimistic-concurrency token from the last read of this request's `version`.
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
                      currentStepOrder: { type: integer }
                      version: { type: integer }
                      decision: { $ref: "#/components/schemas/ApprovalDecision" }
        "403":
          description: Wrong approver role, or self-approval not permitted by policy (FORBIDDEN) — also writes an authorization.denied audit event before responding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No approval step defined for the current order, or an invalid state transition (CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          description: STALE_VERSION (409) if expectedVersion no longer matches, or MODULE_DISABLED (403) if "approvals" is disabled for the tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /tenants/{tenantId}/files:
    post:
      operationId: uploadFile
      summary: Upload a file
      x-noahark-permission: file:upload
      x-noahark-csrf: true
      description: >
        multipart/form-data, not JSON. Server-side MIME sniffing (never
        trusts the client-supplied content type); SHA-256 hashed; stored
        under a randomized, tenant-namespaced key. No malware scanning in
        Phase 1 (explicit, documented gap — see uploadFile's own doc
        comment in packages/files).
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, ownerEntityType, ownerEntityId]
              properties:
                file: { type: string, format: binary }
                ownerEntityType: { type: string, minLength: 1 }
                ownerEntityId: { type: string, minLength: 1 }
                legalEntityId: { type: [string, "null"] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties: { file: { $ref: "#/components/schemas/FileObject" } },
                      },
                  }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "Not multipart/form-data, missing file field, empty file, or exceeds 25 MiB (VALIDATION_FAILED)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        default:
          description: MODULE_DISABLED if the tenant has disabled the "files" module
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /tenants/{tenantId}/files/{fileId}:
    get:
      operationId: getSignedDownloadUrl
      summary: Mint a short-lived signed download URL for a file
      x-noahark-permission: file:read
      x-noahark-csrf: false
      description: Permission is scoped to the FILE's own legal entity, not blindly tenant-wide. The returned URL is valid for 300 seconds and points at GET /files/local/{fileId}.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/fileId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: { type: string }
                      expiresAt: { type: integer, description: epoch milliseconds }
                      file: { $ref: "#/components/schemas/FileObject" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Missing, not ACTIVE, or revoked (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    delete:
      operationId: deleteFile
      summary: Soft-delete a file
      x-noahark-permission: file:delete
      x-noahark-csrf: true
      description: Sets status DELETED and bumps version — every previously-issued signed URL for this file is instantly invalidated. Physical bytes are retained (no hard delete in Phase 1).
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/fileId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties: { file: { $ref: "#/components/schemas/FileObject" } },
                      },
                  }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Missing or already DELETED (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    patch:
      operationId: quarantineOrRevokeFile
      summary: Quarantine a file, or explicitly revoke its outstanding signed URLs
      x-noahark-permission: file:administer
      x-noahark-csrf: true
      description: >
        Both actions bump version, instantly invalidating every previously-
        issued signed URL. quarantine additionally sets status=QUARANTINED;
        revoke sets revokedAt without changing status (the file can be
        re-signed immediately once un-revoked — not built in Phase 1).
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/fileId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [quarantine, revoke] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties: { file: { $ref: "#/components/schemas/FileObject" } },
                      },
                  }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Missing or already DELETED (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tenants/{tenantId}/notifications:
    get:
      operationId: listNotifications
      summary: List the current user's own notifications in this tenant
      x-noahark-permission: null
      x-noahark-csrf: false
      description: Implicitly scoped to the caller's own recipientUserId — not a general permission. Capped at 100 rows; no pagination cursor yet.
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      notifications:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No active membership in this tenant (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /tenants/{tenantId}/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one of the current user's own notifications as read
      x-noahark-permission: null
      x-noahark-csrf: true
      description: Scoped by recipientUserId in the WHERE clause — a user can never mark another user's notification as read even by guessing/enumerating an id.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/notificationId" }
      responses:
        "200":
          description: "{ data: { read: true } }"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tenants/{tenantId}/parties:
    get:
      operationId: listParties
      tags: [Parties]
      security: [{ sessionCookie: [] }]
      summary: List parties visible to the caller
      x-noahark-permission: party:read
      x-noahark-csrf: false
      description: >
        Lists Party masters visible through RLS (owner or assigned legal
        entity in the caller's scope). Archived parties are excluded unless
        `includeArchived=true` or `status=ARCHIVED`. Pagination is
        `(createdAt desc, id desc)` with default effective page size 25
        and maximum returned page size 100. Positive safe integers above
        100 are accepted and capped to 100. Malformed, non-positive,
        unsafe or repeated values return VALIDATION_FAILED.
        Owner-derived authorization uses a tenant-wide `party:read` key
        (`legalEntityId` null). Empty legal-entity scope fails closed.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/partyPageLimit" }
        - name: partyType
          in: query
          schema: { type: string, enum: [ORGANISATION, INDIVIDUAL] }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, ARCHIVED] }
        - name: includeArchived
          in: query
          schema: { type: boolean }
          description: Must be the strings `true` or `false` when present.
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: "{ data: { parties, nextCursor } }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [parties, nextCursor]
                    properties:
                      parties:
                        type: array
                        items: { $ref: "#/components/schemas/Party" }
                      nextCursor:
                        type: [string, "null"]
                        description: Opaque cursor, or null on the final page.
              example:
                data: { parties: [], nextCursor: null }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createParty
      tags: [Parties]
      security: [{ sessionCookie: [] }]
      summary: Create a party master and its first assignment atomically
      x-noahark-permission: party:create
      x-noahark-csrf: true
      description: >
        Single domain call to `createParty`. Authorization uses the
        validated body's `ownerLegalEntityId`. Does not create assignments
        or roles through separate HTTP operations. Embedded duplicate
        candidates use the three-key DuplicateCandidate shape only.
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerLegalEntityId, code, partyType]
              properties:
                ownerLegalEntityId: { type: string }
                code: { type: string, minLength: 1, maxLength: 64 }
                partyType: { type: string, enum: [ORGANISATION, INDIVIDUAL] }
                legalName: { type: string, minLength: 1, maxLength: 200 }
                tradingName: { type: string, minLength: 1, maxLength: 200 }
                givenName: { type: string, minLength: 1, maxLength: 200 }
                familyName: { type: string, minLength: 1, maxLength: 200 }
                taxIdentifier: { type: string, minLength: 1, maxLength: 64 }
                customerRole:
                  type: object
                  required: [code]
                  properties:
                    code: { type: string }
                    defaultCurrency: { type: string, enum: [SGD, MYR, IDR] }
                vendorRole:
                  type: object
                  required: [code]
                  properties:
                    code: { type: string }
                    defaultCurrency: { type: string, enum: [SGD, MYR, IDR] }
                contactEmailForDuplicateCheck: { type: string, maxLength: 320 }
            example:
              ownerLegalEntityId: le_sg
              code: P-1001
              partyType: ORGANISATION
              legalName: Example Co
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      [party, assignment, customerRole, vendorRole, duplicateCandidates]
                    properties:
                      party: { $ref: "#/components/schemas/Party" }
                      assignment: { $ref: "#/components/schemas/PartyAssignment" }
                      customerRole:
                        oneOf:
                          - { $ref: "#/components/schemas/PartyRole" }
                          - { type: "null" }
                      vendorRole:
                        oneOf:
                          - { $ref: "#/components/schemas/PartyRole" }
                          - { type: "null" }
                      duplicateCandidates:
                        type: array
                        items: { $ref: "#/components/schemas/DuplicateCandidate" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /tenants/{tenantId}/parties/{partyId}:
    get:
      operationId: getParty
      tags: [Parties]
      security: [{ sessionCookie: [] }]
      summary: Get one party
      x-noahark-permission: party:read
      x-noahark-csrf: false
      description: >
        Returns a Party visible through RLS. Cross-tenant and unrelated
        legal-entity ids yield the same NOT_FOUND envelope as a missing id.
        Assigned non-owners may read. Owner-derived authorization is tenant-wide.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/partyId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [party]
                    properties:
                      party: { $ref: "#/components/schemas/Party" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateParty
      tags: [Parties]
      security: [{ sessionCookie: [] }]
      summary: Update a party master
      x-noahark-permission: party:update
      x-noahark-csrf: true
      description: >
        Owner-only mutation. Assigned non-owners receive FORBIDDEN, not
        NOT_FOUND. `expectedVersion` is required. `ownerLegalEntityId` in
        the body is ignored and cannot widen ownership.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/partyId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { $ref: "#/components/schemas/ExpectedVersion" }
                legalName: { type: string }
                tradingName: { type: [string, "null"] }
                givenName: { type: string }
                familyName: { type: [string, "null"] }
