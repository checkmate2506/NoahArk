  /tenants/{tenantId}/invitations:
    get:
      operationId: listInvitations
      summary: List membership invitations
      x-noahark-permission: membership:read
      x-noahark-csrf: false
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invitations:
                        type: array
                        items: { $ref: "#/components/schemas/MembershipInvitation" }
        "403":
