    post:
      operationId: createInvitation
      summary: Invite a person to join the tenant by email
      x-noahark-permission: membership:invite
      x-noahark-csrf: true
      description: >
        If intendedRoleId is set, the caller must already hold every
        permission that role grants (no delegation beyond your own
        authority). If intendedLegalEntityId is set, the caller must hold
        legal_entity_membership:grant for it. Phase 1 has no production
        email provider (AD-3) — the raw acceptance token is returned once
        in the response AND logged via the console provider; the admin UI
        surfaces the accept link directly for hand-off.
      parameters: [{ $ref: "#/components/parameters/tenantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                intendedRoleId: { type: [string, "null"] }
                intendedLegalEntityId: { type: [string, "null"] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invitation:
                        type: object
                        properties:
                          id: { type: string }
                          email: { type: string }
                          expiresAt: { type: string, format: date-time }
                      rawToken:
                        type: string
                        description: The unhashed acceptance token — returned exactly once.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

