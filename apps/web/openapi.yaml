                        properties:
                          {
                            setting: { $ref: "#/components/schemas/LegalEntitySetting" },
                          },
                      },
                  }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tenants/{tenantId}/legal-entities/{legalEntityId}/access:
    get:
      operationId: listLegalEntityAccessGrants
      summary: List users granted access to this legal entity
      x-noahark-permission: legal_entity_membership:read
      x-noahark-csrf: false
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/legalEntityId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      grants:
                        type: array
                        items: { $ref: "#/components/schemas/LegalEntityMembership" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: grantLegalEntityAccess
      summary: Grant (or reactivate) a user's access to this legal entity
      x-noahark-permission: legal_entity_membership:grant
      x-noahark-csrf: true
      description: Self-grant is explicitly blocked (assertCanGrantLegalEntityAccess). Upsert — reactivates a previously SUSPENDED grant.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/legalEntityId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, minLength: 1 }
      responses:
        "201":
          description: Created (or reactivated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties:
                          {
                            grant: { $ref: "#/components/schemas/LegalEntityMembership" },
                          },
                      },
                  }
        "403":
          description: Missing permission, or attempted self-grant (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Target user is not an active member of this tenant (CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tenants/{tenantId}/legal-entities/{legalEntityId}/access/{userId}:
    delete:
      operationId: revokeLegalEntityAccess
      summary: Revoke (suspend) a user's access to this legal entity
      x-noahark-permission: legal_entity_membership:revoke
      x-noahark-csrf: true
      description: Self-revocation is explicitly blocked.
      parameters:
        - { $ref: "#/components/parameters/tenantId" }
        - { $ref: "#/components/parameters/legalEntityId" }
        - { $ref: "#/components/parameters/grantUserId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties:
                          {
                            grant: { $ref: "#/components/schemas/LegalEntityMembership" },
                          },
                      },
                  }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: You cannot revoke your own legal-entity access (CONFLICT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

