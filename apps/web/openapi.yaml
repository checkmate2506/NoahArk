                        properties:
                          { legalEntity: { $ref: "#/components/schemas/LegalEntity" } },
                      },
                  }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

