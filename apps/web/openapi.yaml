openapi: 3.1.0
info:
  title: NoahArk API
  version: "1"
  description: >
    Phase 1 foundation surface plus P2D.2a Party, PartyContact and
    PartyAddress APIs. Assignment, customer-role, vendor-role, catalog,
    pricing, custom-field, accounting, payroll, tax, invoicing, purchasing
    and project endpoints are not part of this slice — see
    docs/IMPLEMENTATION_ROADMAP.md.


    **Authentication**: an opaque, HttpOnly, database-backed session cookie
    (`noahark_session`). Tenant/legal-entity identity is never accepted from
    the client — every request re-derives it server-side from the session
    plus the caller's real memberships. A handful of routes are public
    (no session required) because a different artifact — a short-lived
    signed token or HMAC signature — is itself the authorization proof; each
    such operation below is marked `x-noahark-auth: public` and has an empty
    `security: []`.


    **CSRF**: NOT a token scheme. `apiHandler` (the wrapper every route in
    this spec goes through) validates the `Origin` header against a trusted-
    origin allowlist (`AUTH_URL` + `TRUSTED_ORIGINS`) for every state-changing
    method (POST/PUT/PATCH/DELETE) automatically — GET/HEAD are exempt. This
    is enforced identically for every operation below that isn't a GET; the
    `x-noahark-csrf: true` vendor field on each operation is a machine-
    checkable restatement of that fact, not a per-route opt-in.


    **Authorization**: most operations require a specific permission (listed
    per-operation as `x-noahark-permission`), checked via `authorize()` —
    which ALSO verifies the caller has access to the relevant legal entity
    when the operation is entity-scoped, and throws a generic `FORBIDDEN`
    that never distinguishes "not found" from "not permitted". A `null`
    `x-noahark-permission` means the operation is self-service (gated only by
    a valid session) or scoped implicitly to the caller's own records.


    **Errors**: every non-2xx response uses the `ErrorEnvelope` schema.
    `error.code` is always one of `AppErrorCode` (never a raw driver/stack
    message) and `error.requestId` always matches the `x-request-id`
    response header, for correlating a client-reported error with server
    logs.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: noahark_session
      description: >
        Opaque, HttpOnly, database-backed session token. Never a JWT.
        Tenant/legal-entity identity is never accepted from the client —
        every request re-derives it from this session server-side.
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: Stable, client-safe error code — see AppErrorCode (packages/core/src/errors.ts).
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - VALIDATION_FAILED
                - CONFLICT
                - STALE_VERSION
                - RATE_LIMITED
                - IDEMPOTENCY_MISMATCH
                - MODULE_DISABLED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: object
              description: Present only for some codes (e.g. VALIDATION_FAILED's zod issues, MODULE_DISABLED's moduleKey). Never a stack trace or driver error.
            requestId:
              type: string
              format: uuid
    Tenant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
    TenantSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
    LegalEntity:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        jurisdiction: { type: string, enum: [SG, MY, ID] }
        functionalCurrency: { type: string, enum: [SGD, MYR, IDR] }
        timeZone: { type: string }
        defaultLanguage: { type: string, enum: [EN, MS, ID] }
        registeredIdentifier: { type: [string, "null"] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    TenantMembership:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        userId: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: [string, "null"] }
            isDisabled: { type: boolean }
    Permission:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        category: { type: string }
        description: { type: string }
    Role:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        key: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        isSystem: { type: boolean }
        rolePermissions:
          type: array
          items:
            type: object
            properties:
              permission: { $ref: "#/components/schemas/Permission" }
    MembershipRole:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        tenantMembershipId: { type: string }
        roleId: { type: string }
        legalEntityId: { type: [string, "null"] }
        assignedByUserId: { type: string }
    MembershipInvitation:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        email: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED] }
        intendedRoleId: { type: [string, "null"] }
        intendedLegalEntityId: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    LegalEntityMembership:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        legalEntityId: { type: string }
        userId: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: [string, "null"] }
    TenantSetting:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        key: { type: string }
        value: {}
    LegalEntitySetting:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        legalEntityId: { type: string }
        key: { type: string }
        value: {}
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: [string, "null"] }
        legalEntityId: { type: [string, "null"] }
        actorUserId: { type: [string, "null"] }
        actorType: { type: string, enum: [USER, SYSTEM] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, "null"] }
        outcome: { type: string, enum: [SUCCESS, FAILURE, DENIED] }
        sequence:
          type: string
          description: BigInt serialized as a decimal string — the chain's monotonic, gapless position (never createdAt — see AuditPage's nextCursor).
        hash: { type: string }
        prevHash: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    AuditEventPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        nextCursor:
          type: [string, "null"]
          description: >
            Opaque (base64url of the last event's decimal `sequence`).
            Pass back verbatim as `?cursor=` to fetch the next page. `null`
            means no further pages. A malformed cursor is rejected with
            VALIDATION_FAILED, never a crash.
    ApprovalStep:
      type: object
      properties:
        id: { type: string }
        stepOrder: { type: integer }
        approverRoleId: { type: string }
        name: { type: [string, "null"] }
    ApprovalPolicy:
      type: object
      properties:
        id: { type: string }
        subjectType: { type: string }
        name: { type: string }
        isActive: { type: boolean }
        allowSelfApproval: { type: boolean }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ApprovalStep" }
    ApprovalDecision:
      type: object
      properties:
        id: { type: string }
        approvalRequestId: { type: string }
        stepOrder: { type: integer }
        decidedByUserId: { type: string }
        action: { type: string, enum: [APPROVE, REJECT, CANCEL] }
        comment: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    ApprovalRequest:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        legalEntityId: { type: [string, "null"] }
        subjectType: { type: string }
        subjectId: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        currentStepOrder: { type: integer }
        version:
          type: integer
          description: Optimistic-concurrency token — pass back as expectedVersion on /decide.
        submittedByUserId: { type: string }
        approvalPolicy: { $ref: "#/components/schemas/ApprovalPolicy" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/ApprovalDecision" }
    Notification:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        legalEntityId: { type: [string, "null"] }
        channel: { type: string, enum: [IN_APP, EMAIL] }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    FileObject:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        legalEntityId: { type: [string, "null"] }
        originalFilename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        status: { type: string, enum: [ACTIVE, QUARANTINED, DELETED] }
        version:
          type: integer
          description: Bumped on delete/quarantine/revoke/content-replacement — every previously-issued signed URL for a lower version is instantly rejected.
        revokedAt: { type: [string, "null"], format: date-time }
        uploadedByUserId: { type: string }
        createdAt: { type: string, format: date-time }
    Cursor:
      type: string
      description: >
        Opaque pagination cursor. Clients must pass it back verbatim as
        `cursor`. The internal encoding is not part of the public contract
        and must not be parsed by clients. A truncated, forged or otherwise
        invalid cursor is rejected with VALIDATION_FAILED.
    ExpectedVersion:
      type: integer
      minimum: 1
      description: Optimistic-concurrency token. Must match the resource's current version.
    DuplicateCandidate:
      type: object
      additionalProperties: false
      required: [partyId, partyType, matchReasons]
      properties:
        partyId: { type: string }
        partyType: { type: string, enum: [ORGANISATION, INDIVIDUAL] }
        matchReasons:
          type: array
          items: { type: string, enum: [name, email, tax_identifier] }
      description: >
        Advisory duplicate match only. Contact data, names, tax identifiers,
        assignments, roles and codes are never included.
      example:
        partyId: pty_example
        partyType: ORGANISATION
        matchReasons: [name]
    Party:
      type: object
      additionalProperties: false
      required:
        [
          id,
          ownerLegalEntityId,
          code,
          partyType,
          legalName,
          tradingName,
          givenName,
          familyName,
          taxIdentifier,
          status,
          archivedAt,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        ownerLegalEntityId: { type: string }
        code: { type: string }
        partyType: { type: string, enum: [ORGANISATION, INDIVIDUAL] }
        legalName: { type: [string, "null"] }
        tradingName: { type: [string, "null"] }
        givenName: { type: [string, "null"] }
        familyName: { type: [string, "null"] }
        taxIdentifier: { type: [string, "null"] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        archivedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      description: >
        Tenant-scoped Party master. Reads are RLS-filtered to owner or
        assigned legal entities in the caller's scope. Mutations require
        current-owner legal-entity membership. Owner-derived HTTP routes
        authorize with a tenant-wide permission (`legalEntityId` null).
    PartyAssignment:
      type: object
      additionalProperties: false
      description: First legal-entity assignment created atomically by createParty. Assignment APIs are out of scope for P2D.2a.
      required:
        [
          id,
          partyId,
          legalEntityId,
          status,
          assignedAt,
          archivedAt,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        partyId: { type: string }
        legalEntityId: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        assignedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PartyRole:
      type: object
      additionalProperties: false
      description: Optional customer or vendor role created atomically by createParty when requested. Dedicated role APIs are out of scope for P2D.2a.
      required:
        [
          id,
          assignmentId,
          legalEntityId,
          code,
          defaultCurrency,
          status,
          archivedAt,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        assignmentId: { type: string }
        legalEntityId: { type: string }
        code: { type: string }
        defaultCurrency:
          type: [string, "null"]
          enum: [SGD, MYR, IDR, null]
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        archivedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PartyContact:
      type: object
      additionalProperties: false
      required:
        [
          id,
          partyId,
          givenName,
          familyName,
          jobTitle,
          email,
          phone,
          isPrimary,
          status,
          archivedAt,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        partyId: { type: string }
        givenName: { type: string }
        familyName: { type: [string, "null"] }
        jobTitle: { type: [string, "null"] }
        email:
          type: [string, "null"]
          description: >
            Always present. The value is the stored email when the caller
            holds `party_contact:email:read` for the owning legal entity;
            otherwise the property is JSON null. Masking is applied by the
            CRM domain, never reimplemented in the HTTP route.
        phone:
          type: [string, "null"]
          description: >
            Always present. The value is the stored phone when the caller
            holds `party_contact:phone:read` for the owning legal entity;
            otherwise the property is JSON null.
        isPrimary: { type: boolean }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        archivedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PartyAddress:
      type: object
      additionalProperties: false
      required:
        [
          id,
          partyId,
          addressType,
          line1,
          line2,
          line3,
          city,
          region,
          postalCode,
          countryCode,
          status,
          archivedAt,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        partyId: { type: string }
        addressType: { type: string, enum: [BILLING, SHIPPING, REGISTERED, GENERAL] }
        line1: { type: string }
        line2: { type: [string, "null"] }
        line3: { type: [string, "null"] }
        city: { type: [string, "null"] }
        region: { type: [string, "null"] }
        postalCode: { type: [string, "null"] }
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        archivedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    legalEntityId:
      name: legalEntityId
      in: path
      required: true
      schema: { type: string }
    roleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
    invitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
    membershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string }
    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string }
    notificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
    fileId:
      name: fileId
      in: path
      required: true
      schema: { type: string }
    grantUserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    approvalRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    partyId:
      name: partyId
      in: path
      required: true
      schema: { type: string }
    contactId:
      name: contactId
      in: path
      required: true
      schema: { type: string }
    addressId:
      name: addressId
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Cursor" }
      description: Opaque pagination cursor. Pass back verbatim; do not parse.
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 25 }
      description: >
        Optional page size for the Phase-1 audit list. Default effective
        page size is 25. The maximum returned page size is 100. Values
        above 100 are accepted and capped to 100. Non-positive values are
        clamped to 1. This parameter is not used by Party, Contact or
        Address lists.
    partyPageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 25 }
      description: >
        Optional page size for Party, Contact and Address lists. Default
        effective page size is 25. The maximum returned page size is 100.
        Positive safe integers above 100 are accepted and capped to 100.
        Malformed, non-positive, unsafe or repeated values return
        VALIDATION_FAILED (HTTP 422).
  responses:
    Unauthorized:
      description: No valid session (UNAUTHENTICATED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Session valid, but the authorization gate denied the action (FORBIDDEN) — never distinguishes not-found from not-permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource does not exist, or exists in a tenant/legal entity the caller cannot see (NOT_FOUND)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationFailed:
      description: Malformed request body/query (VALIDATION_FAILED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: A business-rule/state conflict (CONFLICT) — e.g. duplicate key, invalid state transition, self-action blocked
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    StaleVersion:
      description: Optimistic-concurrency mismatch — the resource was modified since expectedVersion was read (STALE_VERSION)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ModuleDisabled:
      description: The tenant has explicitly disabled the module this operation belongs to (MODULE_DISABLED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Authenticated write allowance exhausted (RATE_LIMITED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
paths:
  /me/tenants:
    get:
      operationId: listMyTenants
      summary: List tenants the current user has active membership in
      x-noahark-auth: session
      x-noahark-csrf: false
      x-noahark-permission: null
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tenants:
                        type: array
                        items: { $ref: "#/components/schemas/TenantSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with email + password (or begin an MFA challenge)
      x-noahark-auth: public
      x-noahark-csrf: true
      x-noahark-permission: null
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: >
            Either signed in (sets the noahark_session cookie, body
            `{ data: { user: { id, email, name } } }`) or an MFA challenge
            was issued (`{ data: { mfaRequired: true, challengeToken } }`,
            no cookie yet — exchange the token at /auth/mfa/challenge).
        "401":
          description: Invalid email or password (UNAUTHENTICATED) — deliberately identical message/timing for unknown-email and wrong-password, to prevent account-enumeration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          description: >
            RATE_LIMITED — Postgres-backed, dual-dimension (10 failed
            attempts / 15 min per email, 20 / 15 min per trusted-proxy-
            extracted IP). Fails OPEN on limiter infrastructure errors — a
            limiter outage never becomes a global sign-in outage. Also
            returned (N-1, Phase 1D) when the password is correct and the
            account has MFA enabled but its MFA-attempt budget (a
            SEPARATE, per-account Postgres-backed counter — see POST
            /auth/mfa/challenge) is already exhausted — no new challenge
            token is issued in that case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out (invalidates the session server-side; always clears the cookie)
      x-noahark-auth: optional
      x-noahark-csrf: true
      x-noahark-permission: null
      security: []
      description: Idempotent — calling this with no/an already-invalid session cookie still succeeds.
      responses:
        "200":
          description: "{ data: { signedOut: true } }"

  /auth/verify-email/request:
    post:
      operationId: requestEmailVerification
      summary: Request (or resend) an email-verification link for the current user
      x-noahark-auth: session
      x-noahark-csrf: true
      x-noahark-permission: null
      description: >
        Always returns the same response whether or not the account was
        already verified (no verification-status oracle). Resending
        invalidates any still-pending prior token. Delivered via the
        console email provider in Phase 1 (no production provider — AD-3).
      responses:
        "200":
          description: "{ data: { requested: true } }"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/verify-email/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Confirm an email-verification token
      x-noahark-auth: public
      x-noahark-csrf: true
      x-noahark-permission: null
      security: []
      description: The token itself is the authorization artifact — single-use, 24h TTL, SHA-256-hashed at rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: "{ data: { verified: true } }"
        "422":
          description: Invalid or expired verification link (VALIDATION_FAILED) — one generic message covers missing/expired/already-used/lost-race, deliberately no oracle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/mfa/enroll:
    post:
      operationId: enrollMfa
      summary: Begin TOTP MFA enrolment for the current user
      x-noahark-auth: session
      x-noahark-csrf: true
      x-noahark-permission: null
      description: Two-step enrolment (enroll → confirm) — an unconfirmed secret never gates sign-in. Secret is AES-256-GCM encrypted at rest.
      responses:
        "200":
          description: "{ data: { provisioningUri: string, secret: string } } — secret shown once for manual entry."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: MFA is already enabled — disable it before re-enrolling (VALIDATION_FAILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/mfa/confirm:
    post:
      operationId: confirmMfaEnrollment
      summary: Confirm a pending MFA enrolment with a TOTP code
      x-noahark-auth: session
      x-noahark-csrf: true
      x-noahark-permission: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: "{ data: { recoveryCodes: string[] } } — 10 single-use recovery codes, shown once."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /auth/mfa/challenge:
    post:
      operationId: verifyMfaChallenge
      summary: Complete sign-in by verifying a TOTP or recovery code against a challenge token
      x-noahark-auth: public
      x-noahark-csrf: true
      x-noahark-permission: null
      security: []
      description: >
        The challengeToken (issued only after a correct password check
        during sign-in) is the authorization artifact — TTL 5 min, SHA-256-
        hashed, single-use (consumed on lookup regardless of outcome, so a
        failed attempt gets no unlimited retries against one password
        proof). Recovery-code consumption is an atomic conditional UPDATE
        (F-22, Phase 1B.1) — two concurrent challenges racing the same
        recovery code can never both succeed. A submitted TOTP code is
        additionally rejected if its RFC 4226 HOTP counter was already
        accepted before (N-1, Phase 1D — replay protection; an atomic
        conditional UPDATE on the same principle as the recovery-code
        consumption). Rate-limited on two independent, Postgres-backed
        dimensions (N-1, Phase 1D) — per-account (keyed by the resolved
        userId, so a freshly re-issued challenge token after re-submitting
        the correct password does NOT reset this counter) and per
        trusted-proxy-extracted source IP — checked before password
        verification even issues a new token (see POST /auth/sign-in) and
        again here before a submitted code is checked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code:
                  {
                    type: string,
                    description: A 6-digit TOTP code or a single-use recovery code.,
                  }
      responses:
        "200":
          description: 'Signed in — sets the noahark_session cookie. Response: "{ data: { signedIn: true } }"'
        "401":
          description: Invalid/expired challenge token, invalid verification code, or a replayed (already-accepted) TOTP counter (UNAUTHENTICATED) — deliberately one generic message per case, never distinguishing a replay from an ordinary wrong code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          description: Too many MFA attempts for this account or source IP — try again after the window elapses (RATE_LIMITED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/mfa/disable:
    post:
      operationId: disableMfa
      summary: Disable MFA for the current user (requires re-entering the current password)
      x-noahark-auth: session
      x-noahark-csrf: true
      x-noahark-permission: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: "{ data: { disabled: true } } — deletes the MfaCredential, cascading to all recovery codes."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Incorrect password (FORBIDDEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept a membership invitation, provisioning (or activating) the invited user
      x-noahark-auth: public
      x-noahark-csrf: true
      x-noahark-permission: null
      security: []
      description: >
        The invitation token is the authorization artifact. `password` is
        required only if no existing User account matches the invited
        email. Automatically signs the accepting user in (sets the session
        cookie) and applies the pre-configured intendedRoleId/
        intendedLegalEntityId, if any, at acceptance time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                password:
                  {
                    type: string,
                    minLength: 12,
                    description: Required only when no existing account matches the invited email.,
                  }
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: "{ data: { tenantId: string } } — sets the noahark_session cookie."
        "422":
          description: Invalid or expired invitation, or a password is required (VALIDATION_FAILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /files/local/{fileId}:
    get:
      operationId: deliverSignedFile
      summary: Serve a file's bytes given a fully-bound, valid HMAC signature
      x-noahark-auth: public
      x-noahark-csrf: false
      x-noahark-permission: null
      security: []
      description: >
        The signed query string IS the authorization artifact — minted only
        for an already-authorized user by GET
        /tenants/{tenantId}/files/{fileId}. (F-15, Phase 1B.1) The signature
        binds fileId+storageKey+version+operation+expiresAt; the exact
        FileObject row is then loaded through a narrowly-scoped delivery
        context (not a privileged client) and its LIVE status/revokedAt/
        version are re-checked, so delete/quarantine/revoke/content-
        replacement instantly invalidate every previously-issued URL for
        the file, even before its own 300s TTL elapses. Response is raw
        bytes (not the {data} envelope), `Content-Disposition: attachment`,
        `Cache-Control: private, max-age=0, no-store`.
      parameters:
        - { $ref: "#/components/parameters/fileId" }
        - name: sk
          in: query
          required: true
          schema: { type: string }
          description: storageKey — part of the signed payload, verified but never trusted for the actual byte read (the DB-loaded key is used instead).
        - name: v
          in: query
          required: true
          schema: { type: integer }
          description: The FileObject version this signature was minted against.
        - name: exp
          in: query
          required: true
          schema: { type: integer }
          description: Signature expiry, epoch milliseconds.
        - name: sig
          in: query
          required: true
          schema: { type: string }
          description: 64-character lowercase-hex HMAC-SHA256 signature.
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream: {}
        "404":
          description: >
            NOT_FOUND — covers every failure mode (bad signature, expired,
            deleted, quarantined, revoked, stale version, malformed input)
            with one identical response, deliberately, so this endpoint
            never becomes a file-existence or signature-validity oracle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: Missing or non-numeric signature parameters (VALIDATION_FAILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

