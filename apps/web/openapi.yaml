        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  {
                    data:
                      {
                        type: object,
                        properties:
                          { legalEntity: { $ref: "#/components/schemas/LegalEntity" } },
                      },
                  }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

